name: game-intelligence

services:
  app:
    build: .
    restart: unless-stopped
    env_file: ./deploy/ip.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      AUTH_MODE: accounts
      AUTH_COOKIE_SECURE: "true"
      AUTH_TRUST_PROXY: "true"
      AUTH_USERS_FILE: /run/game-intelligence/accounts.json
      DATABASE_FILE: /app/data/investment.sqlite
    ports:
      - "127.0.0.1:8768:3001"
    volumes:
      - app_data:/app/data
      - ./deploy/secrets/accounts.json:/run/game-intelligence/accounts.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_data:

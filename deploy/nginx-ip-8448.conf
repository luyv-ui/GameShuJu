# 独立端口，不修改现有 443 上的活动、音乐和小游戏站点。
server {
    listen 8448 ssl;
    server_name 129.204.33.162;

    ssl_certificate /etc/letsencrypt/live/129.204.33.162/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/129.204.33.162/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8768;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 3s;
    }
}
